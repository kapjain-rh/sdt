name: nginx-server
description: Simple nginx pod for smoke testing
template: templates/common/pod.yaml
parameters:
  Name: nginx-test
  Namespace: sdt-example-test
  Image: nginx:latest
  Port: "80"
lifecycle:
  create: Apply the pod template with the given parameters
  ready: Wait for pod nginx-test in namespace sdt-example-test to be Running and Ready
  cleanup: Delete pod nginx-test from namespace sdt-example-test
