apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nginx-server
parameters:
  - name: Name
    description: Server pod name
    value: nginx-server
  - name: Namespace
    description: Target namespace
    required: true
objects:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: ${Name}
      namespace: ${Namespace}
      labels:
        app: ${Name}
        role: server
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
